# mc-monitoring-1 ホストメトリクス収集（node-exporter → ローカル VictoriaMetrics）
# 注: tagomori-app は別リポ cloud-observability-gateway 側が自前で
#     mc-monitoring の VictoriaMetrics へ remote_write(push) するため、
#     ここから scrape はしない（instance=tagomori-app で受信済み）。
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          instance: mc-monitoring
          role: monitoring
          machine_type: e2-small
