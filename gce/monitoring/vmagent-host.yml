# mc-monitoring-1 ホストメトリクス収集 + 同一VPCの他GCE VMの node-exporter scrape
# （tagomori-app は別リポ cloud-observability-gateway 管理。内部VPC 10.100.0.15:9100 を scrape）
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          instance: mc-monitoring
          role: monitoring
      # tagomori-app（Status Platform: cloudflared/envoy/api/mariadb）。
      # 別リポで prom/node-exporter:9100 を起動すれば up になる。
      - targets: ['10.100.0.15:9100']
        labels:
          instance: tagomori-app
          role: app
