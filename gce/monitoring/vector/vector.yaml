# ============================================================
# Vector aggregator on mc-monitoring-1
# ============================================================
# k3s Vector DaemonSet (Tailscale 100.121.113.37) から
# Vector プロトコル (port 9001) でログを受信し、
# 同一 Docker ネットワーク内の VictoriaLogs に転送する。
#
# ログフロー:
#   k3s Vector DaemonSet
#     → vector://100.121.113.37:9001  (Tailscale)
#     → vector (aggregator, this config)
#     → http://victoria-logs:9428/insert/loki/api/v1/push
# ============================================================

sources:
  from_k3s:
    type: vector
    address: "0.0.0.0:9001"
    version: "2"

sinks:
  victorialogs:
    type: loki
    inputs: [from_k3s]
    # VictoriaLogs の Loki 互換 API エンドポイント
    # Vector は endpoint + /loki/api/v1/push を POST 先にする
    endpoint: "http://victoria-logs:9428/insert"
    labels:
      job: "{{ job }}"
      container: "{{ log_container }}"
      namespace: "{{ log_namespace }}"
      pod: "{{ log_pod }}"
    encoding:
      codec: text
    compression: none
    request:
      concurrency: 4
