services:

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.115.0
    container_name: victoria-metrics
    restart: unless-stopped
    ports:
      # Tailscale 経由での vmagent remote_write 受信。外部には非公開。
      - "8428:8428"
    volumes:
      - victoria-metrics-data:/victoria-metrics
    command:
      - "-storageDataPath=/victoria-metrics"
      # 1s scrape は高解像度のため保持を 14 日に短縮（長期データは BigQuery 側）。
      # e2-small (2GB) で容量逼迫を避けるための再構築後の値。
      - "-retentionPeriod=14d"
      - "-httpListenAddr=:8428"
      # メモリ上限: e2-small (2GB) のうち 40% = 約800MB
      - "-memory.allowedPercent=40"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.24.0-victorialogs
    container_name: victoria-logs
    restart: unless-stopped
    ports:
      # k3s Vector DaemonSet (Tailscale 経由) からのログ受信 + Grafana クエリ
      - "9428:9428"
    volumes:
      - victoria-logs-data:/victoria-logs
    command:
      - "-storageDataPath=/victoria-logs"
      - "-retentionPeriod=30d"
      - "-httpListenAddr=:9428"
      # e2-small (2GB) のうち 20% = 約400MB
      - "-memory.allowedPercent=20"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9428/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  vector:
    image: timberio/vector:0.56.0-debian
    container_name: vector
    restart: unless-stopped
    ports:
      # k3s Vector DaemonSet (Tailscale 経由) からの Vector プロトコル受信
      - "9001:9001"
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
    command: ["--config", "/etc/vector/vector.yaml"]
    depends_on:
      victoria-logs:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.1
    container_name: grafana
    restart: unless-stopped
    ports:
      # Tailscale 経由でのみ到達可能（GCE ファイアウォールで外部非公開）
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # 初回ログイン後に必ず変更すること
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://gce-mc-monitoring:3000
      - GF_ANALYTICS_REPORTING_ENABLED=false
      # VictoriaLogs 用 Grafana プラグイン（起動時に自動インストール）
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
    depends_on:
      victoria-metrics:
        condition: service_healthy

  # ── Discord 通知（課金アラートのみ。GCP Budget→Pub/Sub のイベント駆動分）──
  # メトリクス系アラート（沈黙/Down 等）は vmalert + Alertmanager へ移行。
  # GCE メタデータ ADC（mc-monitoring-sa）を使うため host network。
  discord-notifier:
    image: google/cloud-sdk:slim
    container_name: discord-notifier
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./scripts/discord-notifier.py:/scripts/discord-notifier.py:ro
    command: ["python3", "/scripts/discord-notifier.py"]

  # ── vmalert（VictoriaMetrics に対しルール評価 → Alertmanager へ発火）──
  vmalert:
    image: victoriametrics/vmalert:v1.115.0
    container_name: vmalert
    restart: unless-stopped
    volumes:
      - ./vmalert/rules:/etc/vmalert/rules:ro
    command:
      - "-datasource.url=http://victoria-metrics:8428"
      - "-remoteWrite.url=http://victoria-metrics:8428"
      - "-notifier.url=http://alertmanager:9093"
      - "-rule=/etc/vmalert/rules/*.yml"
      - "-evaluationInterval=30s"
    depends_on:
      victoria-metrics:
        condition: service_healthy
      alertmanager:
        condition: service_started

  # ── Alertmanager（webhook → alertmanager-discord ブリッジ）──
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    depends_on:
      - alertmanager-discord

  # ── Alertmanager → Discord ブリッジ（AM webhook を Discord embed に変換）──
  # DISCORD_WEBHOOK は compose の .env（cloud-init が Secret Manager から生成）から注入。
  alertmanager-discord:
    image: rogerrum/alertmanager-discord:1.1.0
    container_name: alertmanager-discord
    restart: unless-stopped
    environment:
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK}
      - DISCORD_USERNAME=mc-alertmanager

volumes:
  victoria-metrics-data:
  victoria-logs-data:
  grafana-data:
  alertmanager-data:
