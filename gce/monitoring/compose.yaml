services:

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.115.0
    container_name: victoria-metrics
    restart: unless-stopped
    ports:
      # Tailscale 経由での vmagent remote_write 受信。外部には非公開。
      - "8428:8428"
    volumes:
      - victoria-metrics-data:/victoria-metrics
    command:
      - "-storageDataPath=/victoria-metrics"
      # 1s scrape は高解像度のため保持を 14 日に短縮（長期データは BigQuery 側）。
      # e2-small (2GB) で容量逼迫を避けるための再構築後の値。
      - "-retentionPeriod=14d"
      - "-httpListenAddr=:8428"
      # メモリ上限: e2-small (2GB) のうち 40% = 約800MB
      - "-memory.allowedPercent=40"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8428/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.24.0-victorialogs
    container_name: victoria-logs
    restart: unless-stopped
    ports:
      # k3s Vector DaemonSet (Tailscale 経由) からのログ受信 + Grafana クエリ
      - "9428:9428"
    volumes:
      - victoria-logs-data:/victoria-logs
    command:
      - "-storageDataPath=/victoria-logs"
      - "-retentionPeriod=30d"
      - "-httpListenAddr=:9428"
      # e2-small (2GB) のうち 20% = 約400MB
      - "-memory.allowedPercent=20"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9428/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  vector:
    image: timberio/vector:0.56.0-debian
    container_name: vector
    restart: unless-stopped
    ports:
      # k3s Vector DaemonSet (Tailscale 経由) からの Vector プロトコル受信
      - "9001:9001"
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
    command: ["--config", "/etc/vector/vector.yaml"]
    depends_on:
      victoria-logs:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.1
    container_name: grafana
    restart: unless-stopped
    ports:
      # Tailscale 経由でのみ到達可能（GCE ファイアウォールで外部非公開）
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # 初回ログイン後に必ず変更すること
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://gce-mc-monitoring:3000
      - GF_ANALYTICS_REPORTING_ENABLED=false
      # VictoriaLogs 用 Grafana プラグイン（起動時に自動インストール）
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
    depends_on:
      victoria-metrics:
        condition: service_healthy

  # ── Discord 通知（課金アラート + オンプレ沈黙アラートを Pull → Discord）──
  # mc-proxy-1 の systemd から移設。GCE メタデータ ADC（mc-monitoring-sa）を使うため host network。
  discord-notifier:
    image: google/cloud-sdk:slim
    container_name: discord-notifier
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./scripts/discord-notifier.py:/scripts/discord-notifier.py:ro
    command: ["python3", "/scripts/discord-notifier.py"]

  # ── オンプレ沈黙検知（VM をクエリし途絶時に Pub/Sub へ publish）──
  healthcheck:
    image: google/cloud-sdk:slim
    container_name: healthcheck
    restart: unless-stopped
    network_mode: host
    environment:
      # host network のためローカル VM は 127.0.0.1:8428
      - VM_URL=http://127.0.0.1:8428
    volumes:
      - ./scripts/healthcheck.py:/scripts/healthcheck.py:ro
    command: ["python3", "/scripts/healthcheck.py"]
    depends_on:
      victoria-metrics:
        condition: service_healthy

volumes:
  victoria-metrics-data:
  victoria-logs-data:
  grafana-data:
