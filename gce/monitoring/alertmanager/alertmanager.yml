# ============================================================
# Alertmanager 設定（vmalert → Alertmanager → Discord）
# ============================================================
# Discord はネイティブ receiver が無く、/slack 互換エンドポイントは attachment を
# 弾く(400)ため、alertmanager-discord ブリッジ経由で Discord ネイティブ embed に
# 変換する。webhook URL は機密のためブリッジ側の DISCORD_WEBHOOK env（compose の
# .env、cloud-init が Secret Manager から生成）で渡す。
# ============================================================
global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Tailscale auth-key ローテは手動運用（Secret Manager を人手で再発行）のため、
    # 期限接近アラートは Alertmanager UI 上には残しつつ Discord 通知は抑止する。
    # 鍵ローテ時は vmalert/rules/minecraft.yml の epoch を更新すること。
    - matchers:
        - alertname="TailscaleAuthKeyExpiringSoon"
      receiver: 'null'

receivers:
  - name: discord
    webhook_configs:
      - url: http://alertmanager-discord:9094
        send_resolved: true
  # 通知を出さない受信先（Discord 抑止用）
  - name: 'null'
