# ============================================================
# TAK Pipeline - Minecraft Proxy on GCE (Docker Compose)
# ============================================================
# ホストネットワークで socat TCP/UDP 透過転送
# Tailscale はホスト側 systemd で kernel mode 動作
#
# 接続フロー:
#   Java    : 35.200.78.252:25565/TCP --> socat-tcp  --> 100.107.122.45:30065 (Tailscale -> k3s survival)
#   Bedrock : 35.200.78.252:19132/UDP --> socat-bedrock --> 100.107.122.45:19132 (Tailscale -> k3s bedrock)
# ============================================================

services:
  # Java Edition TCP 透過転送 (socat)
  socat-tcp:
    image: alpine/socat:latest
    container_name: socat-tcp
    restart: unless-stopped
    network_mode: host
    command:
      - "TCP4-LISTEN:25565,fork,reuseaddr"
      - "TCP4:100.107.122.45:30065"

  # Bedrock RakNet は nginx UDP proxy では動作しないため socat で透過中継
  # fork オプションでクライアントごとに独立ソケットを生成し RakNet セッションを正しく維持
  socat-bedrock:
    image: alpine/socat:latest
    container_name: socat-bedrock
    restart: unless-stopped
    network_mode: host
    command:
      - "UDP4-LISTEN:19132,fork,reuseaddr"
      - "UDP4:100.107.122.45:19132"

  # ── ホストメトリクス（このVMの CPU/メモリ/ディスク/NW）──
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - '/:/host:ro,rslave'

  # node-exporter を scrape し mc-monitoring の VictoriaMetrics へ remote_write（push）
  # MIG 再作成で Tailscale IP が変わるため scrape ではなく push 型で収集
  vmagent-host:
    image: victoriametrics/vmagent:v1.115.0
    container_name: vmagent-host
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./vmagent.yml:/etc/vmagent/vmagent.yml:ro
    command:
      - "-promscrape.config=/etc/vmagent/vmagent.yml"
      - "-remoteWrite.url=http://100.121.113.37:8428/api/v1/write"
    depends_on:
      - node-exporter