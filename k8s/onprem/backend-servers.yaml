# ============================================================
# TAK Pipeline - Backend Servers (MinecraftServer k3s)
# ============================================================
# オンプレ MinecraftServer ノードに展開するリソース
#
# コンポーネント:
#   Survival 統合サーバー (Helm Chart 管理 / values-survival.yaml)
#   Bedrock Server        : Bedrock Edition (4-8Gi)
#
# 接続フロー:
#   Java    : GCE socat-tcp(:25565) → Tailscale → svc-survival:30065
#   Bedrock : GCE socat-bedrock(:19132) → Tailscale → svc-bedrock:19132
#   Prometheus → Tailscale → mc-monitor(:8080) 各Pod
# ============================================================

# ── Namespace ────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
  labels:
    app.kubernetes.io/part-of: tak-pipeline
    location: onprem-minecraft-server

---
# ── Paper-Velocity 設定テンプレート ──────────────────────────
# Velocity forwarding secret 設定（Paper サーバー用 / 現在未使用）
apiVersion: v1
kind: ConfigMap
metadata:
  name: paper-velocity-config
  namespace: minecraft
  labels:
    app.kubernetes.io/part-of: tak-pipeline
data:
  paper-global.yml.template: |
    proxies:
      velocity:
        enabled: true
        online-mode: true
        secret: "__VELOCITY_SECRET__"

---
# Java サーバー (Survival 統合) は Helm Chart で管理

---
# ============================================================
# Bedrock カスタム Prometheus エクスポーター
# ============================================================
# BDS 1.26.x は RakNet Unconnected Pong に MOTD 文字列を含まない
# 33 バイト最小応答を返す（itzg/mc-monitor では unexpected EOF → healthy=0）。
# このエクスポーターは MOTD の有無に関わらず任意の Pong 応答を healthy=1 と判定する。
apiVersion: v1
kind: ConfigMap
metadata:
  name: bedrock-monitor-cm
  namespace: minecraft
  labels:
    app.kubernetes.io/component: bedrock
    app.kubernetes.io/part-of: tak-pipeline
data:
  monitor.py: |
    #!/usr/bin/env python3
    import glob, socket, struct, time, random, threading
    from http.server import HTTPServer, BaseHTTPRequestHandler

    MAGIC = b'\x00\xff\xff\x00\xfe\xfe\xfe\xfe\xfd\xfd\xfd\xfd\x12\x34\x56\x78'
    HOST, PORT = '127.0.0.1', 19132
    INTERVAL, TIMEOUT = 15, 5
    DATA_DIR = '/data'

    def read_static_info():
        """BDS バージョンと max-players を起動時に server.properties / ファイル名から取得。
        BDS 1.26.x は RakNet pong に MOTD を含まないためここで補完する。"""
        max_players = 0
        version = ''
        try:
            with open(f'{DATA_DIR}/server.properties') as f:
                for line in f:
                    if line.startswith('max-players='):
                        max_players = int(line.split('=', 1)[1].strip())
        except (OSError, ValueError):
            pass
        try:
            # itzg wrapper が /data/bedrock_server-X.Y.Z.W を作成する
            matches = glob.glob(f'{DATA_DIR}/bedrock_server-*')
            if matches:
                version = matches[0].split('bedrock_server-', 1)[1]
        except Exception:
            pass
        return max_players, version

    _static_max_players, _static_version = read_static_info()

    _lock = threading.Lock()
    _state = {'healthy': 0, 'players': 0, 'rt': 0.0}

    def ping():
        s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        s.settimeout(TIMEOUT)
        try:
            pkt = b'\x01' + struct.pack('>Q', int(time.time()*1000)) + MAGIC + struct.pack('>Q', random.getrandbits(64))
            t0 = time.monotonic()
            s.sendto(pkt, (HOST, PORT))
            data, _ = s.recvfrom(4096)
            elapsed = time.monotonic() - t0
            # MOTD があれば players_online を解析（BDS 将来版で修正された場合に対応）
            players = 0
            if len(data) > 35:
                slen = struct.unpack('>H', data[33:35])[0]
                if len(data) >= 35 + slen > 0:
                    parts = data[35:35+slen].decode('utf-8', errors='replace').split(';')
                    try: players = int(parts[4])
                    except (ValueError, IndexError): pass
            return 1, players, elapsed
        except socket.timeout:
            return 0, 0, 0.0
        except Exception:
            return 0, 0, 0.0
        finally:
            s.close()

    def loop():
        while True:
            h, p, rt = ping()
            with _lock:
                _state.update({'healthy': h, 'players': p, 'rt': rt})
            time.sleep(INTERVAL)

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != '/metrics':
                self.send_response(404); self.end_headers(); return
            with _lock:
                s = dict(_state)
            v = _static_version
            lbl = f'server_edition="bedrock",server_host="{HOST}",server_port="{PORT}",server_version="{v}"'
            body = '\n'.join([
                '# HELP minecraft_status_healthy Indicates if the server is healthy (1) or not (0)',
                '# TYPE minecraft_status_healthy gauge',
                f'minecraft_status_healthy{{{lbl}}} {s["healthy"]}',
                '# HELP minecraft_status_players_online_count Current online players',
                '# TYPE minecraft_status_players_online_count gauge',
                f'minecraft_status_players_online_count{{{lbl}}} {s["players"]}',
                '# HELP minecraft_status_players_max_count Maximum players',
                '# TYPE minecraft_status_players_max_count gauge',
                f'minecraft_status_players_max_count{{{lbl}}} {_static_max_players}',
                '# HELP minecraft_status_response_time_seconds Server response time in seconds',
                '# TYPE minecraft_status_response_time_seconds gauge',
                f'minecraft_status_response_time_seconds{{{lbl}}} {s["rt"]}',
            ]) + '\n'
            self.send_response(200)
            self.send_header('Content-Type', 'text/plain; version=0.0.4; charset=utf-8')
            self.end_headers()
            self.wfile.write(body.encode())
        def log_message(self, *a): pass

    threading.Thread(target=loop, daemon=True).start()
    print(f'bedrock-monitor :8080 -> {HOST}:{PORT} | version={_static_version} max_players={_static_max_players}')
    HTTPServer(('', 8080), Handler).serve_forever()

---
# ============================================================
# 3. Bedrock Server (2GB)
# ============================================================
# さくらVPS Nginx(UDP Proxy) → Tailscale → このサーバー
# Nginx_Sakura --> TS_Router_Sub -->|転送| Bedrock_Server
# (infrastructure.mermaid)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-bedrock
  namespace: minecraft
  labels:
    app.kubernetes.io/component: bedrock
    app.kubernetes.io/part-of: tak-pipeline
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-bedrock
  namespace: minecraft
  labels:
    app.kubernetes.io/component: bedrock
    app.kubernetes.io/part-of: tak-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mc-bedrock
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mc-bedrock
        app.kubernetes.io/component: bedrock
      annotations:
        # mc-monitor が :8080 でメトリクスを公開する（19132/UDP ではない）
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        # ── Bedrock サーバー本体 ──────────────────────────────
        - name: bedrock
          image: itzg/minecraft-bedrock-server:latest
          env:
            - { name: EULA, value: "TRUE" }
            - { name: TZ, value: "Asia/Tokyo" }
            - { name: ONLINE_MODE, value: "false" }
            - { name: SERVER_NAME, value: "Sushi.ski-Server" }
            - { name: GAMEMODE, value: "survival" }
            - { name: FORCE_GAMEMODE, value: "true" }
            - { name: DIFFICULTY, value: "easy" }
            - { name: ALLOW_CHEATS, value: "true" }
            - { name: MAX_PLAYERS, value: "25" }
            - { name: ALLOW_LIST, value: "false" }
            - { name: VIEW_DISTANCE, value: "48" }
            - { name: TICK_DISTANCE, value: "8" }
            - { name: PLAYER_IDLE_TIMEOUT, value: "30" }
            - { name: RAKNET_FORCE_MTU, value: "1200" }
            - { name: DISABLE_CLIENT_VIBRANT_VISUALS, value: "false" }
          ports:
            - containerPort: 19132
              hostPort: 19132
              name: bedrock
              protocol: UDP
          volumeMounts:
            - mountPath: /data
              name: data
          resources:
            requests: { memory: "4Gi", cpu: "4" }
            limits: { memory: "8Gi", cpu: "8" }
        # Probes removed due to missing mc-monitor binary in bedrock image

        # ── カスタム Bedrock モニター（Prometheus Exporter）────────
        # BDS 1.26.x の MOTDなし最小Pong に対応した Python 製エクスポーター。
        # itzg/mc-monitor は MOTD 必須のため healthy=0 になる問題を回避。
        - name: mc-monitor
          image: python:3.12-alpine
          command: ["python3", "/scripts/monitor.py"]
          ports:
            - containerPort: 8080
              name: metrics
          volumeMounts:
            - name: bedrock-monitor-script
              mountPath: /scripts
            - name: data
              mountPath: /data
              readOnly: true
          resources:
            requests: { memory: "32Mi", cpu: "10m" }
            limits: { memory: "64Mi", cpu: "100m" }

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-bedrock
        - name: bedrock-monitor-script
          configMap:
            name: bedrock-monitor-cm

---
apiVersion: v1
kind: Service
metadata:
  name: svc-bedrock
  namespace: minecraft
  labels:
    app.kubernetes.io/component: bedrock
    app.kubernetes.io/part-of: tak-pipeline
spec:
  selector:
    app: mc-bedrock
  type: ClusterIP
  ports:
    - port: 19132
      name: bedrock
      protocol: UDP
    - port: 8080
      name: metrics
